name: reduce-tx-lag
description: Minimizar latencia de traducción (TX lag) sin starvation ni romper tests

metric:
  primary:
    type: hard
    name: tx_lag_p95_ms
    direction: minimize
  degenerate_gates:
    - name: tests_passed
      check: "== 1"
      description: El harness debe completar con emisiones de traducción
    - name: tx_starvation
      check: "== 0"
      description: Debe haber al menos una traducción emitida
  diagnostics:
    - name: tx_lag_p50_ms
    - name: nllb_decode_p95_ms
    - name: coalesce_skips_total
    - name: translate_calls
    - name: chars_translated

measurement:
  command: "PYTHONPATH=. python tools/eval/measure_tx_lag.py"
  timeout_seconds: 60
  working_directory: "."
  stability:
    mode: repeat
    repeat_count: 3
    aggregation: median
    noise_threshold: 2.0

scope:
  mutable:
    - "src/asr/pipeline.py"
    - "src/asr/translate.py"
    - "src/config.py"
  immutable:
    - "tools/eval/measure_tx_lag.py"
    - "tests/"
    - "src/ui/"

execution:
  mode: serial
  backend: worktree
  max_concurrent: 1

parallel:
  port_strategy: none
  shared_files: []

dependencies:
  approved: []

constraints:
  - "No traducir parciales"
  - "No añadir deps pesadas (transformers/torch/Marian)"
  - "Mantener contrato CaptionUpdate seq/append"
  - "Defaults de producto seguros; flags opt_* como overrides"
  - "Harness es sintético: ganancias reales NLLB/GPU se validan en smoke manual"

stopping:
  max_iterations: 4
  max_hours: 1
  plateau_iterations: 3
  target_reached: true

max_runner_up_merges_per_batch: 0
